name: 配置商店 HTTPS

on:
  workflow_dispatch:

concurrency:
  group: acg-faka-production
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: 检查现有代理
        env:
          PROD_SERVER_ADDRESS: ${{ secrets.PROD_SERVER_ADDRESS }}
          PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
          PROD_SERVER_PWD: ${{ secrets.PROD_SERVER_PWD }}
          PROD_SERVER_PORT: ${{ secrets.PROD_SERVER_PORT }}
        run: |
          set -euo pipefail
          [[ "$PROD_SERVER_ADDRESS" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$PROD_SERVER_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$PROD_SERVER_PORT" =~ ^[0-9]{1,5}$ ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$PROD_SERVER_PWD"
          sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$PROD_SERVER_PORT" "$PROD_SERVER_USER@$PROD_SERVER_ADDRESS" 'bash -s' < deployment/inspect-proxy.sh
