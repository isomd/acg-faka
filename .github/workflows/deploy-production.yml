name: 构建并部署 acg-faka

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      deploy_existing_sha:
        description: '仅重新部署已有 SHA 镜像（填写完整 40 位提交 SHA；留空则构建）'
        required: false
        type: string

concurrency:
  group: acg-faka-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      IMAGE: ${{ secrets.DOCKER_REPO }}/acg-faka:sha-${{ inputs.deploy_existing_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: PHP 环境
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, gd, mbstring, openssl, pdo_mysql, zip
          coverage: none

      - name: 核对加密配置和源码
        env:
          EXISTING_SHA: ${{ inputs.deploy_existing_sha }}
        run: |
          if [[ -n "$EXISTING_SHA" ]]; then
            [[ "$EXISTING_SHA" =~ ^[a-f0-9]{40}$ ]]
          fi
          test -s deployment/database.enc.json
          php -r '$e=json_decode(file_get_contents("deployment/database.enc.json"),true,8,JSON_THROW_ON_ERROR); if (($e["version"]??null)!==1 || ($e["cipher"]??null)!=="aes-256-gcm") exit(1);'
          test -f app/Pay/Mercury/Impl/Pay.php
          php -l kernel/Util/EncryptedDeploymentConfig.php
          php -l app/Controller/Install.php
          php -l kernel/Kernel.php

      - name: 安装依赖并运行协议测试
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php tests/EncryptedDeploymentConfigTest.php
          php tests/MercuryProtocolTest.php

      - name: 准备 QEMU
        if: inputs.deploy_existing_sha == ''
        uses: docker/setup-qemu-action@v3

      - name: 准备 Buildx
        if: inputs.deploy_existing_sha == ''
        uses: docker/setup-buildx-action@v3

      - name: 计算发布标签
        id: release
        env:
          IMAGE_REPOSITORY: ${{ secrets.DOCKER_REPO }}/acg-faka
        run: |
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            echo "$IMAGE_REPOSITORY:$version" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 构建并推送镜像
        if: inputs.deploy_existing_sha == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 核对镜像内容
        run: |
          docker pull "$IMAGE"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'test -f /opt/acg-faka/database.enc.json && test -f /opt/acg-skel/pay/Mercury/Impl/Pay.php'

      - name: 验证服务器可匿名拉取
        run: |
          anonymous_config="$RUNNER_TEMP/docker-anonymous"
          mkdir -p "$anonymous_config"
          docker --config "$anonymous_config" manifest inspect "$IMAGE" >/dev/null

      - name: 通过 SSH 发布
        env:
          PROD_SERVER_ADDRESS: ${{ secrets.PROD_SERVER_ADDRESS }}
          PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
          PROD_SERVER_PWD: ${{ secrets.PROD_SERVER_PWD }}
          PROD_SERVER_PORT: ${{ secrets.PROD_SERVER_PORT }}
          DEPLOY_BASE: ${{ vars.DEPLOY_BASE || '/srv/acg-faka' }}
          ACG_HTTP_PORT: ${{ vars.ACG_HTTP_PORT || '80' }}
          ACG_CONFIG_KEY_HEX: ${{ secrets.ACG_CONFIG_KEY_HEX }}
        run: |
          set -euo pipefail
          [[ "$PROD_SERVER_ADDRESS" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$PROD_SERVER_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$PROD_SERVER_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_BASE" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_BASE" != *'..'* ]]
          [[ "$ACG_HTTP_PORT" =~ ^[0-9]{1,5}$ ]]
          test -n "$PROD_SERVER_PWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$PROD_SERVER_PWD"
          ssh_args=(-o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$PROD_SERVER_PORT")
          sshpass -e ssh "${ssh_args[@]}" "$PROD_SERVER_USER@$PROD_SERVER_ADDRESS" "mkdir -p '$DEPLOY_BASE'"
          sshpass -e scp -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -P "$PROD_SERVER_PORT" deployment/deploy.sh "$PROD_SERVER_USER@$PROD_SERVER_ADDRESS:$DEPLOY_BASE/deploy.sh"
          printf '%s\n' "$ACG_CONFIG_KEY_HEX" \
            | sshpass -e ssh "${ssh_args[@]}" "$PROD_SERVER_USER@$PROD_SERVER_ADDRESS" "bash '$DEPLOY_BASE/deploy.sh' '$IMAGE' '$DEPLOY_BASE' '$ACG_HTTP_PORT'"
